services:
  membrick:
    build:
      context: .
      dockerfile: Dockerfile
    image: membrick-server:local
    ports:
      - "127.0.0.1:8080:8080"
    command: ["--settings", "/etc/membrick/server.toml", "--allow-non-loopback"]
    volumes:
      - membrick-data:/data
      - ./deploy/docker/server.toml:/etc/membrick/server.toml:ro
    secrets:
      - source: membrick_server_token
        target: server-token
    restart: unless-stopped

secrets:
  membrick_server_token:
    file: ./secrets/server-token

volumes:
  membrick-data:
