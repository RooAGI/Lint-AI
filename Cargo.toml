[package]
autobins = false
name = "lint-ai"
version = "0.3.0"
edition = "2021"
description = "Persistent memory layer for AI coding agents — MCP server with current-state retrieval and supersession tracking"
license = "Apache-2.0"
repository = "https://github.com/RooAGI/Lint-AI"
homepage = "https://www.rooagi.com"
readme = "README.md"
keywords = ["agent-memory", "mcp", "knowledge-base", "AI", "agents"]
categories = ["text-processing", "command-line-utilities"]

[lib]
name = "lint_ai"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
clap = { version = "4.4.18", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.20"
toml = "0.8"
walkdir = "2"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
regex = "1"
roaring = "0.10"
anyhow = "1"
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
jsonwebtoken = "9"
aho-corasick = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
comrak = { version = "0.20", default-features = false }
Inflector = "0.11"
unicode-normalization = "0.1"
deunicode = "1"
rust-stemmers = "1"
petgraph = "0.5"
tantivy = "0.25.0"
oxicode = { version = "0.2.6", features = ["serde"] }
text2num = "2.8"
thesaurus = "0.5"
temps = { version = "3", features = ["chrono"] }
fuzzydate = "0.4.1"
console = { version = "0.16.3", features = ["std"] }
sha2 = "0.10"
rayon = "1.11"
libflate = "1.4"
pyo3 = { version = "0.29", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["heuristic-query-semantics", "agent-integrations"]
heuristic-query-semantics = []
agent-integrations = ["claude-code", "codex", "gemini-cli", "agy", "muse-code", "openclaw", "hermes", "roo-runtime"]
claude-code = []
codex = []
gemini-cli = []
agy = []
muse-code = []
openclaw = []
hermes = []
roo-runtime = []
python = ["dep:pyo3", "dep:reqwest"]
experimental = []

[[bin]]
name = "lint-ai"
path = "src/main.rs"

[[bin]]
name = "corpus_scale_benchmark"
path = "src/bin/launchers/corpus_scale_benchmark.rs"

[[bin]]
name = "haystack_indexstore_benchmark"
path = "src/bin/launchers/haystack_indexstore_benchmark.rs"

[[bin]]
name = "haystack_scoped_benchmark"
path = "src/bin/launchers/haystack_scoped_benchmark.rs"

[[bin]]
name = "jevbench_case_classifier"
path = "src/bin/launchers/jevbench_case_classifier.rs"

[[bin]]
name = "locomo_benchmark"
path = "src/bin/launchers/locomo_benchmark.rs"

[[bin]]
name = "locomo_benchmark_search_server"
path = "src/bin/launchers/locomo_benchmark_search_server.rs"
required-features = ["agent-integrations"]

[[bin]]
name = "project_memory_recency_benchmark"
path = "src/bin/launchers/project_memory_recency_benchmark.rs"

[[bin]]
name = "recency_benchmark"
path = "src/bin/launchers/recency_benchmark.rs"

[[bin]]
name = "refresh_scaling_benchmark"
path = "src/bin/launchers/refresh_scaling_benchmark.rs"

[[bin]]
name = "segment_scoped_benchmark"
path = "src/bin/launchers/segment_scoped_benchmark.rs"
required-features = ["experimental"]

[[bin]]
name = "server"
path = "src/bin/launchers/server.rs"

[[bin]]
name = "session_ab_benchmark"
path = "src/bin/launchers/session_ab_benchmark.rs"

[[bin]]
name = "validate_corpus"
path = "src/bin/launchers/validate_corpus.rs"

[[bin]]
name = "query_repl"
path = "src/bin/launchers/query_repl.rs"

[dev-dependencies]
# Only the SIGKILL crash test needs raw syscalls now; the lock itself is std.
libc = "0.2"
