replicaCount: 1

image:
  repository: ghcr.io/rooagi/lint-ai-server
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

auth:
  # Create this Secret before installing the chart. It must contain SERVER_TOKEN.
  existingSecret: lint-ai-auth

service:
  type: ClusterIP
  port: 8080

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""

resources: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
