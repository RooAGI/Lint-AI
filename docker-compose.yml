services:
  lint-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: lint-ai-server:local
    ports:
      - "8080:8080"
    environment:
      SERVER_TOKEN: "${SERVER_TOKEN:?Set SERVER_TOKEN before starting the service}"
    volumes:
      - lint-ai-data:/data
    restart: unless-stopped

volumes:
  lint-ai-data:
