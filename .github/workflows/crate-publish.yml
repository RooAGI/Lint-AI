name: Publish Rust crate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Match release tag to crate version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
          echo "value=$package_version" >> "$GITHUB_OUTPUT"

      - name: Check whether this crate version is already published
        id: published
        env:
          CRATE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header 'User-Agent: membrick-release-workflow (https://github.com/RooAGI/Membrick)' \
            "https://crates.io/api/v1/crates/membrick/$CRATE_VERSION")"
          case "$status" in
            200)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "membrick $CRATE_VERSION is already published; skipping."
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unexpected crates.io response: HTTP $status" >&2
              exit 1
              ;;
          esac

      - name: Verify crate package
        if: steps.published.outputs.publish == 'true'
        run: cargo publish --dry-run --locked

      - name: Exchange GitHub OIDC identity for a crates.io token
        if: steps.published.outputs.publish == 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crate
        if: steps.published.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
