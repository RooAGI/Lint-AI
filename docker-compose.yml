services:
  membrick:
    build:
      context: .
      dockerfile: Dockerfile
    image: membrick-server:local
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TOKEN: "${SERVER_TOKEN:?Set SERVER_TOKEN before starting the service}"
    volumes:
      - membrick-data:/data
    restart: unless-stopped

volumes:
  membrick-data:
