name: Node binding

on:
  pull_request:
    paths:
      - "bindings/node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-binding.yml"
      - ".github/workflows/node-publish.yml"
  push:
    branches: [main]
    paths:
      - "bindings/node/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node-binding.yml"
      - ".github/workflows/node-publish.yml"

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node build dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      - name: Build native binding
        working-directory: bindings/node
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            npx napi build --platform --release --target "${{ matrix.target }}" --use-napi-cross
          else
            npx napi build --platform --release --target "${{ matrix.target }}"
          fi
      - name: Run Node tests
        if: ${{ !matrix.cross }}
        working-directory: bindings/node
        run: npm test
