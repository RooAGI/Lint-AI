name: Publish Node binding

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-addon:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node build dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      - name: Build addon
        working-directory: bindings/node
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            npx napi build --platform --release --target "${{ matrix.target }}" --use-napi-cross
          else
            npx napi build --platform --release --target "${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: node-addon-${{ matrix.target }}
          path: bindings/node/membrick_node.*.node
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build-addon
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install package tooling
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      - name: Match release tag to package version
        working-directory: bindings/node
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== `v${require("./package.json").version}`) process.exit(1)'
      - uses: actions/download-artifact@v4
        with:
          pattern: node-addon-*
          path: bindings/node/artifacts
      - name: Create platform packages and collect binaries
        working-directory: bindings/node
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts --npm-dir npm
          for target in darwin-arm64 darwin-x64 linux-arm64-gnu linux-x64-gnu win32-x64-msvc; do
            test -f "npm/$target/membrick_node.$target.node"
          done
      - name: Publish platform packages, then the root package
        working-directory: bindings/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx napi pre-publish --no-gh-release
          npm publish --access public --ignore-scripts
