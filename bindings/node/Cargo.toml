[package]
name = "membrick-node"
version = "0.4.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
membrick = { path = "../.." }
napi = { version = "3", default-features = false, features = ["napi8", "serde-json", "async"] }
napi-derive = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2.6"
