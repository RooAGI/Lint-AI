[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "membrick"
version = "0.6.2"
description = "Persistent agent memory API and CLI, backed by Membrick's Rust MemoryService"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = []
keywords = ["lint", "markdown", "knowledge-base", "AI", "agents"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://www.rooagi.com"
Repository = "https://github.com/RooAGI/Membrick"

[tool.maturin]
# abi3-py38: one wheel installs on CPython 3.8+ (matches requires-python).
# Without abi3, maturin emits per-interpreter wheels (cp312-cp312-...).
features = ["python", "pyo3/abi3-py38"]
module-name = "membrick"
