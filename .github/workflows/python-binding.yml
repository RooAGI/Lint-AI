name: Python binding

# Builds the optional pyo3 extension and runs the Python test suite.
# The full-test-matrix only *compiles* --all-features; this job actually
# exercises the binding. Keep it small: one platform, one Python.

on:
  pull_request:
    paths:
      - "src/lib.rs"
      - "tests/python/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/python-binding.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib.rs"
      - "tests/python/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install maturin
        run: pip install maturin
      - name: Create venv for maturin develop
        # maturin develop refuses to install outside a virtualenv; put the
        # venv first on PATH so later steps use it without re-activating.
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and install the extension
        # NB: do not pass --features here; the CLI flag would override the
        # [tool.maturin] features in pyproject.toml (python + pyo3/abi3-py38).
        run: maturin develop
      - name: Run the Python suite
        # Scope to the binding tests: test_docs_site.py needs a prior
        # `mkdocs build` and is owned by the docs workflow.
        run: python -m unittest tests.python.test_memory tests.python.test_behood_query -v
      - name: Assert package version is self-consistent
        run: python -c "import lint_ai, importlib.metadata as m; v=lint_ai.version(); assert v == m.version('lint-ai'), (v, m.version('lint-ai')); print('lint_ai', v)"
